# Mic processing chain, replacing the old EasyEffects pipeline:
#   Fifine mic -> Gate -> 8-band EQ -> Compressor -> "mic_fx_source"
#
# DeepFilterNet used to sit in front of the gate. Its LADSPA plugin inserts
# silence whenever its worker underruns ("Output underrun, increasing
# processing latency"), which is what friends hear as the mic cutting out.
# Discord's own noise suppression covers that job without eating words.
# mic_fx_source is consumed by loop_micfx_capture in 60-voice-chat.conf.
#
# EasyEffects was dropped for this role: its own internal PipeWire chain-linking
# proved non-deterministic on this system (per-plugin nodes sometimes failed to
# link to each other at all, independent of which plugin was active), and its
# DeepFilterNet ("Deep Noise Remover") plugin separately zeroed the mic output
# outright — reproduced identically across two different builds of the LADSPA
# library. This file is fully static config instead: no GUI app instance, no
# per-app process to flake out, matching how loop_micfx/loop_soundboard/
# voice_chat_mix already work.
#
# CALF Gate/Equalizer 8 Band/Compressor: ports and control symbols verified
# directly from the installed .ttl manifests (/usr/lib/lv2/calf.lv2/*.ttl).
# Values below reuse the tuning from the old EasyEffects config, converted to
# each plugin's native units (CALF gain/threshold/makeup controls are linear
# amplitude ratios, not dB — dB values were converted via 10^(dB/20)).
#
# The old EQ's 8 bands don't map 1:1 onto CALF Equalizer 8 Band's fixed slot
# layout (hp/lp/ls/hs + 4 parametric bands, vs the old plugin's freely-typed
# bands). Faithfully carried over: 80Hz high-pass, -2dB@200Hz, -1dB@500Hz,
# +0.5dB@1kHz, +2dB@3kHz. The old +1dB@6kHz bell is approximated here as the
# high-shelf slot. The old 10kHz high-shelf (0dB gain — a no-op) and 16kHz
# band (muted) were both inert already and are simply dropped.

context.modules = [
  {
    name = libpipewire-module-filter-chain
    flags = [ nofail ]
    args = {
      node.description = "Mic FX (Gate + EQ + Compressor)"
      media.name       = "Mic FX"
      filter.graph = {
        nodes = [
          {
            type  = lv2
            name  = gate
            plugin = "http://calf.sourceforge.net/plugins/Gate"
            control = {
              # Speaking level on this mic is about -32 dB RMS. A -32 dB
              # hard gate was opening and closing on the words themselves.
              threshold    = 0.003162  # -50 dB
              range        = 0.000251  # -72 dB max reduction
              ratio        = 10
              attack       = 5         # ms
              release      = 180       # ms
              detection    = 0         # RMS
            }
          }
          {
            type  = lv2
            name  = eq
            plugin = "http://calf.sourceforge.net/plugins/Equalizer8Band"
            control = {
              hp_active  = 1
              hp_freq    = 80
              hp_mode    = 1        # 24 dB/oct
              hp_q       = 0.7
              p1_active  = 1
              p1_freq    = 200
              p1_level   = 0.7943  # -2 dB
              p1_q       = 1.2
              p2_active  = 1
              p2_freq    = 500
              p2_level   = 0.8913  # -1 dB
              p2_q       = 1.0
              p3_active  = 1
              p3_freq    = 1000
              p3_level   = 1.0593  # +0.5 dB
              p3_q       = 1.0
              p4_active  = 1
              p4_freq    = 3000
              p4_level   = 1.2589  # +2 dB
              p4_q       = 1.2
              hs_active  = 1
              hs_freq    = 6000
              hs_level   = 1.1220  # +1 dB
            }
          }
          {
            type  = lv2
            name  = compressor
            plugin = "http://calf.sourceforge.net/plugins/Compressor"
            control = {
              threshold = 0.1259   # -18 dB
              ratio     = 3
              attack    = 12       # ms
              release   = 100      # ms
              makeup    = 1.5849   # +4 dB
              detection = 0        # RMS
            }
          }
        ]
        links = [
          { output = "gate:out_l" input = "eq:in_l" }
          { output = "gate:out_r" input = "eq:in_r" }
          { output = "eq:out_l" input = "compressor:in_l" }
          { output = "eq:out_r" input = "compressor:in_r" }
        ]
        inputs  = [ "gate:in_l" "gate:in_r" ]
        outputs = [ "compressor:out_l" "compressor:out_r" ]
      }
      audio.rate     = 48000
      audio.position = [ FL FR ]
      capture.props = {
        node.passive  = true
        # node.name set in wireplumber 51-rename-devices.conf. The raw
        # ALSA name grows a .2/.3 suffix after a USB re-enumerate, and a
        # missed target makes this input fall back onto voice_chat — a
        # loop that never includes the Fifine.
        target.object = "fifine_mic"
      }
      playback.props = {
        media.class      = "Audio/Source"
        node.name         = "mic_fx_source"
        node.description  = "Mic FX Source"
      }
    }
  }
]
