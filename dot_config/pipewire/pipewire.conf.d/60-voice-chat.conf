# Voice Chat mix for Discord (+ future soundboard).
# Hardware rename policy stays in wireplumber 51-rename-devices.conf.
#
# Graph:
#   Fifine -> EasyEffects -> easyeffects_source -+
#                                                +--> voice_chat_mix (Sink) --> voice_chat (Source) <-- Discord
#   Soundboard apps -----------> soundboard -----+
#
# voice_chat_mix must be a Sink so WirePlumber will honor target.object on
# the loopbacks. Audio/Source/Virtual made WP send mic FX to the headset.

context.objects = [
  {
    factory = adapter
    args = {
      factory.name = support.null-audio-sink
      node.name = "voice_chat_mix"
      node.description = "Voice Chat Mix"
      media.class = "Audio/Sink"
      audio.position = [ FL FR ]
      object.linger = true
      monitor.channel-volumes = true
      # Keep demoted so music/apps never pick this as a speaker
      priority.session = 1
      priority.driver = 1
    }
  }
  {
    factory = adapter
    args = {
      factory.name = support.null-audio-sink
      node.name = "soundboard"
      node.description = "Soundboard"
      media.class = "Audio/Sink"
      audio.position = [ FL FR ]
      object.linger = true
      monitor.channel-volumes = true
      priority.session = 1
      priority.driver = 1
    }
  }
]

context.modules = [
  {
    name = libpipewire-module-loopback
    flags = [ nofail ]
    args = {
      node.description = "Mic FX to Voice Chat Mix"
      capture.props = {
        node.name = "loop_micfx_capture"
        target.object = "easyeffects_source"
        node.passive = true
        node.dont-reconnect = false
        audio.position = [ FL FR ]
      }
      playback.props = {
        node.name = "loop_micfx_playback"
        target.object = "voice_chat_mix"
        node.passive = true
        node.dont-reconnect = true
        stream.dont-remix = true
        audio.position = [ FL FR ]
      }
    }
  }
  {
    name = libpipewire-module-loopback
    flags = [ nofail ]
    args = {
      node.description = "Soundboard to Voice Chat Mix"
      capture.props = {
        node.name = "loop_soundboard_capture"
        target.object = "soundboard"
        stream.capture.sink = true
        node.passive = true
        node.dont-reconnect = true
        audio.position = [ FL FR ]
      }
      playback.props = {
        node.name = "loop_soundboard_playback"
        target.object = "voice_chat_mix"
        node.passive = true
        node.dont-reconnect = true
        stream.dont-remix = true
        audio.position = [ FL FR ]
      }
    }
  }
  # Expose the mix as a real Source Discord can record from
  {
    name = libpipewire-module-loopback
    flags = [ nofail ]
    args = {
      node.description = "Voice Chat"
      capture.props = {
        node.name = "loop_voicechat_capture"
        target.object = "voice_chat_mix"
        stream.capture.sink = true
        node.passive = true
        node.dont-reconnect = true
        audio.position = [ FL FR ]
      }
      playback.props = {
        node.name = "voice_chat"
        node.description = "Voice Chat"
        media.class = "Audio/Source"
        audio.position = [ FL FR ]
        priority.session = 2500
        priority.driver = 2500
      }
    }
  }
]
