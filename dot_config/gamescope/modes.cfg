# Matched against gamescope's "make model" string (pnp.ids + EDID product name).
# Preferred mode on this TCL is 4K60, which is what locked Big Picture at 60 fps.
# 4K120 is the highest mode the current "Beyond TV" EDID exposes, and it modesets.
# Enabling the TV's high-refresh / Game Master option renames the panel to
# "Beyo TV" and adds 4K144; that line is used only after the EDID changes.
Technical Concepts Ltd Beyond TV:3840x2160@120
Technical Concepts Ltd Beyo TV:3840x2160@144
