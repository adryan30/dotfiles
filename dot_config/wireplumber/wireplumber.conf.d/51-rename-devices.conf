# Audio policy for this machine.
# Active devices:
#   - Output: Edifier W820NB Plus BT ↔ Edifier USB (charging) ↔ GPU HDMI
#   - Input:  Fifine USB mic only (Voice Chat mix is the Discord default)
# Disabled: motherboard ALC897, APU HDMI, USB Fifine headphone jack,
#           Edifier BT HFP mic, Edifier USB headset mic
#
# Apply:  pw-rename-devices
# Inspect: pw-list-devices

monitor.alsa.rules = [
  ########################################################################
  # Enabled cards
  ########################################################################

  {
    matches = [
      { device.name = "~alsa_card.pci-0000_03_00.1.*" }
    ]
    actions = {
      update-props = {
        device.description = "GPU HDMI"
        device.nick = "GPU HDMI"
      }
    }
  }

  {
    matches = [
      { device.name = "~alsa_card.usb-3142_a010.*" }
      { device.name = "~alsa_card.usb-3142_fifine.*" }
      { device.name = "~alsa_card.usb-.*fifine.*" }
    ]
    actions = {
      update-props = {
        device.description = "Fifine Mic"
        device.nick = "Fifine Mic"
      }
    }
  }

  {
    matches = [
      { device.name = "~alsa_card.usb-EDFIER_EDIFIER_W820NB.*" }
      { device.name = "~alsa_card.usb-.*W820NB.*" }
    ]
    actions = {
      update-props = {
        device.description = "Edifier Headset (Cable)"
        device.nick = "Edifier Headset (Cable)"
      }
    }
  }

  ########################################################################
  # Disabled cards — front/back panel + APU HDMI
  ########################################################################

  {
    matches = [
      { device.name = "~alsa_card.pci-0000_11_00.6.*" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }

  {
    matches = [
      { device.name = "~alsa_card.pci-0000_11_00.1.*" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }

  ########################################################################
  # Enabled nodes
  ########################################################################

  {
    matches = [
      { node.name = "~alsa_output.pci-0000_03_00.1.*" }
    ]
    actions = {
      update-props = {
        node.description = "GPU HDMI"
        node.nick = "GPU HDMI"
        priority.session = 1500
      }
    }
  }

  {
    matches = [
      { node.name = "~alsa_input.usb-3142_a010.*" }
      { node.name = "~alsa_input.usb-3142_fifine.*" }
      { node.name = "~alsa_input.usb-.*fifine.*" }
    ]
    actions = {
      update-props = {
        node.description = "Fifine Mic"
        node.nick = "Fifine Mic"
        priority.session = 2000
      }
    }
  }

  {
    matches = [
      { node.name = "~alsa_output.usb-EDFIER_EDIFIER_W820NB.*" }
      { node.name = "~alsa_output.usb-.*W820NB.*" }
    ]
    actions = {
      update-props = {
        node.description = "Edifier Headset (Cable)"
        node.nick = "Edifier Headset (Cable)"
        # Below BT (2100), above GPU HDMI (1500)
        priority.session = 2000
        priority.driver = 2000
      }
    }
  }

  ########################################################################
  # Disabled / demoted nodes
  ########################################################################

  {
    matches = [
      { node.name = "~alsa_output.usb-3142_a010.*" }
      { node.name = "~alsa_output.usb-3142_fifine.*" }
      { node.name = "~alsa_output.usb-.*fifine.*" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }

  {
    matches = [
      { node.name = "~alsa_input.usb-EDFIER_EDIFIER_W820NB.*" }
      { node.name = "~alsa_input.usb-.*W820NB.*" }
    ]
    actions = {
      update-props = {
        node.description = "Edifier Headset Mic (Cable)"
        node.nick = "Edifier Headset Mic (Cable)"
        # Never steal default mic from Fifine / Voice Chat
        priority.session = 1
        priority.driver = 1
      }
    }
  }
]

monitor.bluez.rules = [
  {
    matches = [
      { device.name = "~bluez_card.64_68_76_5A_F8_F5.*" }
      { api.bluez5.address = "64:68:76:5A:F8:F5" }
    ]
    actions = {
      update-props = {
        device.description = "Edifier Headset"
        device.nick = "Edifier Headset"
        # A2DP only — no HFP/HSP; Fifine USB mic stays the mic
        bluez5.auto-connect = [ a2dp_sink ]
      }
    }
  }

  {
    matches = [
      { node.name = "~bluez_output.64_68_76_5A_F8_F5.*" }
      {
        node.name = "~bluez_output.*"
        api.bluez5.address = "64:68:76:5A:F8:F5"
      }
    ]
    actions = {
      update-props = {
        node.description = "Edifier Headset"
        node.nick = "Edifier Headset"
        priority.session = 2100
        priority.driver = 2100
      }
    }
  }

  {
    matches = [
      { node.name = "~bluez_input.64_68_76_5A_F8_F5.*" }
      {
        node.name = "~bluez_input.*"
        api.bluez5.address = "64:68:76:5A:F8:F5"
      }
    ]
    actions = {
      update-props = {
        node.description = "Edifier Headset Mic"
        node.nick = "Edifier Headset Mic"
        priority.session = 1
        priority.driver = 1
      }
    }
  }
]
