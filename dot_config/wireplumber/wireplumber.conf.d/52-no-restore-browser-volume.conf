# Zen/Firefox map in-page media volume (YouTube slider, etc.) onto the
# PipeWire stream's channelVolumes. WirePlumber was saving that and
# restoring it on the next stream, so a quiet video left the browser
# stuck quiet afterward (mixer showed ~53% when YT had been at ~15%).
#
# Do not remember/restore stream volumes for these apps. Still restore
# sink routing (state.restore-target stays default/true).

stream.rules = [
  {
    matches = [
      { application.name = "Zen" }
      { application.process.binary = "zen-bin" }
      { application.name = "Firefox" }
    ]
    actions = {
      update-props = {
        state.restore-props = false
      }
    }
  }
]
