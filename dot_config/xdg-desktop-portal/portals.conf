# xdg-desktop-portal picks the first matching config file and does not merge,
# so this restates niri's shipped defaults (/usr/share/xdg-desktop-portal/niri-portals.conf).
#
# niri implements no RemoteDesktop backend (niri-wm/niri#390), so KDE Connect
# remote input is routed to the hypr-kdeconnect bridge instead.

[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
org.freedesktop.impl.portal.RemoteDesktop=hypr-kdeconnect;
