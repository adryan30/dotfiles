[Service]
# Steam Big Picture (gamescope-session) takes DRM master on the 9070.
# Drive only the TCL over HDMI. Refresh comes from
# ~/.config/gamescope/modes.cfg — the EDID preferred mode is 4K60.
Environment=OUTPUT_CONNECTOR=HDMI-A-1
# VRR, and allow Steam to change refresh after the TV advertises 144 Hz.
Environment=gamescope_adaptive_sync=true
Environment=gamescope_drm_allow_dynamic_modes_for_external_display=true
